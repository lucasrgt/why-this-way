[package]
name = "why-this-way"
version = "0.1.1"
edition = "2024"
description = "Repository-local decisions and invariants for coding agents"
repository = "https://github.com/lucasrgt/why-this-way"
license = "MIT"
readme = "README.md"

[workspace]
members = ["xtask"]
resolver = "3"

[lib]
name = "wtw"

[[bin]]
name = "wtw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
ulid = "3"

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,tokei
      - run: cargo xtask verify

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild@0.23.0
      - name: Verify tag
        shell: pwsh
        run: |
          $packages = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages
          $version = ($packages | Where-Object name -eq "why-this-way").version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag/version mismatch" }
      - run: cargo test --locked --target ${{ matrix.target }}
      - name: Build portable Linux binary
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17
      - name: Build native release binary
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          $name = "wtw-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/wtw${{ matrix.suffix }}" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: wtw-${{ matrix.target }}
          path: dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip | sort > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" *.zip SHA256SUMS --verify-tag \
            --title "Why This Way ${GITHUB_REF_NAME}" --generate-notes
